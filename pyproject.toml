[project]
name = "opspilot-ai"
version = "0.1.0"
description = "Local-first agentic incident investigation platform (LangGraph + MCP + hybrid RAG on PostgreSQL/pgvector, local models via Ollama)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
authors = [{ name = "OpsPilot AI contributors" }]
dependencies = [
  "fastapi>=0.162,<0.163",
  "uvicorn[standard]>=0.54,<0.55",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "sqlalchemy[asyncio]>=2.1,<2.2",
  "alembic>=1.20,<2",
  "psycopg[binary,pool]>=3.3,<3.4",
  "pgvector>=0.5,<0.6",
  "langgraph>=1.2,<1.3",
  "langgraph-checkpoint-postgres>=3.2,<4",
  "mcp>=2.3,<3",
  "httpx>=0.28,<0.29",
  "structlog>=26.1,<27",
  "opentelemetry-api>=1.45,<2",
  "opentelemetry-sdk>=1.45,<2",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.45,<2"]

[project.scripts]
opspilot = "opspilot_api.cli:main"
opspilot-mcp = "opspilot_mcp.cli:main"
opspilot-eval = "opspilot_eval.runner:main"

[dependency-groups]
dev = [
  "pytest>=9.2,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.17,<0.18",
  "mypy>=2.4,<3",
  "import-linter>=2.5,<3",
  "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "apps/api/opspilot_api",
  "packages/shared/opspilot_shared",
  "packages/agents/opspilot_agents",
  "packages/rag/opspilot_rag",
  "packages/mcp/opspilot_mcp",
  "packages/evaluation/opspilot_eval",
  "services/simulator/opspilot_simulator",
]

[tool.hatch.build]
dev-mode-dirs = [
  "apps/api",
  "packages/shared",
  "packages/agents",
  "packages/rag",
  "packages/mcp",
  "packages/evaluation",
  "services/simulator",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: requires the local PostgreSQL container",
  "live_llm: requires a running Ollama with the configured models (opt-in via --run-live)",
  "e2e: full-stack tests against running services",
]
filterwarnings = ["ignore::DeprecationWarning:pydantic.*"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["apps/api", "packages/shared", "packages/agents", "packages/rag", "packages/mcp", "packages/evaluation", "services/simulator", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF", "PTH", "TID"]
ignore = ["S101", "S311", "RUF012", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ASYNC"]
"infra/db/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]
mypy_path = "apps/api:packages/shared:packages/agents:packages/rag:packages/mcp:packages/evaluation:services/simulator"
explicit_package_bases = true
exclude = ["apps/web", "infra/db/migrations", "tests"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "langgraph.*", "yaml", "opentelemetry.exporter.*"]
ignore_missing_imports = true

[tool.importlinter]
include_external_packages = true
root_packages = [
  "opspilot_api", "opspilot_shared", "opspilot_agents", "opspilot_rag",
  "opspilot_mcp", "opspilot_eval", "opspilot_simulator",
]

[[tool.importlinter.contracts]]
name = "Shared kernel depends on nothing internal"
type = "forbidden"
source_modules = ["opspilot_shared"]
forbidden_modules = ["opspilot_api", "opspilot_agents", "opspilot_rag", "opspilot_mcp", "opspilot_eval", "opspilot_simulator"]

[[tool.importlinter.contracts]]
name = "Agents depend only on ports, not adapters"
type = "forbidden"
source_modules = ["opspilot_agents"]
forbidden_modules = ["opspilot_api", "opspilot_rag", "opspilot_mcp", "opspilot_eval", "opspilot_simulator", "sqlalchemy", "fastapi", "httpx", "opspilot_shared.db", "opspilot_shared.llm.ollama"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "RAG and simulator do not depend on orchestration or presentation"
type = "forbidden"
source_modules = ["opspilot_rag", "opspilot_simulator"]
forbidden_modules = ["opspilot_api", "opspilot_agents", "opspilot_mcp", "opspilot_eval"]

[[tool.importlinter.contracts]]
name = "Nothing imports the evaluation harness"
type = "forbidden"
source_modules = ["opspilot_api", "opspilot_agents", "opspilot_rag", "opspilot_mcp", "opspilot_simulator", "opspilot_shared"]
forbidden_modules = ["opspilot_eval"]
